name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas datasets scikit-learn transformers torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate HuggingFace data
        run: python data/scrape_huggingface.py

      - name: Run tokenizer tests
        run: pytest tests/test_preprocess.py -v

      - name: Run data tests
        run: pytest tests/test_data.py::TestHuggingFaceData -v